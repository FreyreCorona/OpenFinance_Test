name: producer-build

on:
  push:
    branches: [master]
    paths:
      - 'src/cmd/producer/**'
      - 'src/internal/**'
      - 'src/go.*'
      - 'src/Dockerfile.producer'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t ghcr.io/${{ github.repository }}/producer:latest -f src/Dockerfile.producer src/
          docker push ghcr.io/${{ github.repository }}/producer:latest